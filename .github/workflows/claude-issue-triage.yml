name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Asegurar labels de área y complejidad
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh label create "area:gameplay" --color "1d76db" --description "Lógica del juego (piezas, colisiones, líneas)" --force
          gh label create "area:render" --color "1d76db" --description "Dibujo en canvas / loop de juego" --force
          gh label create "area:ui" --color "1d76db" --description "HTML/CSS, interfaz visual" --force
          gh label create "area:input" --color "1d76db" --description "Manejo de teclado/controles" --force
          gh label create "area:build-infra" --color "1d76db" --description "Workflows, scripts, configuración del repo" --force
          gh label create "complejidad:baja" --color "c2e0c6" --description "Cambio pequeño y acotado" --force
          gh label create "complejidad:media" --color "fbca04" --description "Requiere tocar varias funciones" --force
          gh label create "complejidad:alta" --color "e99695" --description "Cambio estructural o riesgoso" --force

      - name: Diagnóstico y etiquetado con Claude
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Seguí al pie de la letra las instrucciones del archivo .github/ISSUE_TRIAGE.md de este
            repositorio para triar el issue #${{ github.event.issue.number }}.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh api:*)"
